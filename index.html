<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>نتائج منافسات اعتماد</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' ><rect width='32' height='32' rx='8' fill='%23223668'/><rect x='8' y='16' width='4' height='8' rx='1.5' fill='%23fff'/><rect x='14' y='11' width='4' height='13' rx='1.5' fill='%23fff' opacity='.85'/><rect x='20' y='7' width='4' height='17' rx='1.5' fill='%23fff' opacity='.7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","SF Arabic","Inter","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --bg:#f5f5f7; --panel:#ffffff; --panel-2:#fbfbfd; --ink:#1d1d1f; --muted:#6e6e73; --faint:#86868b;
  --line:rgba(60,60,67,.12); --line-strong:rgba(60,60,67,.2);
  --brand:#223668; --brand-solid:#223668; --brand-2:#5b7cc4; --brand-soft:#e2ebf7; --brand-ink:#ffffff;
  --bar-bad:#c9ced8;
  --green:#1e7f46; --green-soft:#e2f3e8; --orange:#a35400; --orange-soft:#fdf0e0; --red:#c4302b; --red-soft:#fbe8e7;
  --chrome:rgba(255,255,255,.72);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(34,54,104,.06);
  --shadow-lift:0 2px 4px rgba(0,0,0,.05),0 14px 32px rgba(34,54,104,.10);
  --radius:18px; --radius-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --panel:#1c1c1e; --panel-2:#242426; --ink:#f5f5f7; --muted:#98989d; --faint:#7c7c80;
    --line:rgba(84,84,88,.45); --line-strong:rgba(120,120,128,.5);
    --brand:#9db3e6; --brand-solid:#4a65a8; --brand-2:#7b98d8; --brand-soft:#1b2440; --brand-ink:#ffffff;
    --bar-bad:#4a4a4e;
    --green:#30d158; --green-soft:#12301d; --orange:#ff9f0a; --orange-soft:#33260f; --red:#ff6961; --red-soft:#3a1a19;
    --chrome:rgba(28,28,30,.72);
    --shadow-sm:none; --shadow:none; --shadow-lift:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1c1c1e; --panel-2:#242426; --ink:#f5f5f7; --muted:#98989d; --faint:#7c7c80;
  --line:rgba(84,84,88,.45); --line-strong:rgba(120,120,128,.5);
  --brand:#9db3e6; --brand-solid:#4a65a8; --brand-2:#7b98d8; --brand-soft:#1b2440; --brand-ink:#ffffff;
  --bar-bad:#4a4a4e;
  --green:#30d158; --green-soft:#12301d; --orange:#ff9f0a; --orange-soft:#33260f; --red:#ff6961; --red-soft:#3a1a19;
  --chrome:rgba(28,28,30,.72);
  --shadow-sm:none; --shadow:none; --shadow-lift:0 10px 30px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);
  -webkit-font-smoothing:antialiased;font-optical-sizing:auto;text-rendering:optimizeLegibility;transition:background-color .3s ease,color .3s ease}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand-2) 55%,transparent);outline-offset:2px;border-radius:8px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Chrome ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--chrome);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:inherit}
.brand:hover{text-decoration:none}
.mark{width:34px;height:34px;flex:none;border-radius:8px;box-shadow:0 1px 3px rgba(34,54,104,.25)}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-text b{font-size:15px;font-weight:650;white-space:nowrap}
.brand-text span{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:10px;padding:2px;gap:2px}
.seg > *{border:0;background:transparent;color:var(--muted);font:500 13px/1 var(--font);padding:7px 14px;border-radius:8px;
  cursor:pointer;white-space:nowrap;transition:background-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.seg > *:hover{color:var(--ink);text-decoration:none}
.seg > .on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
.spacer{flex:1}
.icon-btn{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer;
  transition:background-color .15s ease,color .15s ease,transform .1s ease-out}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.icon-btn:active{transform:scale(.92)}
.lang-btn{font:600 13px/1 var(--font);width:auto;padding:0 12px}
.who{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;padding-inline-start:4px;border-inline-start:1px solid var(--line);
  padding-inline-start:12px;margin-inline-start:2px}
@media (max-width:600px){.who{display:none}}

/* ---------- Layout ---------- */
main{max-width:1240px;margin:0 auto;padding:24px 16px 72px}
#view.enter{animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;line-height:1.15;font-weight:700;margin:0 0 6px}
h2{font-size:17px;line-height:1.3;font-weight:650;margin:0}
html[lang="en"] h1{letter-spacing:-.022em} html[lang="en"] h2{letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head .sub{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.span2{grid-column:1/-1}
.card{background:var(--panel);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0;
  border:1px solid color-mix(in srgb,var(--line) 60%,transparent);transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.card.hover:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.note{color:var(--faint);font-size:12.5px;margin:-6px 0 12px}
.chart{position:relative;height:270px} .chart.tall{height:330px}

/* ---------- Hero ---------- */
.hero{position:relative;border-radius:22px;padding:28px 28px 24px;color:#fff;margin-bottom:16px;
  background:linear-gradient(135deg,#223668 0%,#2c4687 55%,#3a5aa3 100%);box-shadow:0 10px 30px rgba(34,54,104,.25)}
.hero > *{position:relative;z-index:1}
.hero h1{color:#fff;font-size:30px}
.hero p{color:rgba(255,255,255,.82);margin:0;max-width:640px}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);
  color:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill i{width:7px;height:7px;border-radius:50%;background:#7ee2a8;display:inline-block}
.pill.warn i{background:#ffb35c}

/* ---------- KPIs ---------- */
button.kpi{font:inherit;color:inherit;text-align:start;width:100%;cursor:pointer;position:relative;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background-color .2s ease}
button.kpi:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
button.kpi:active{transform:scale(.98)}
button.kpi .go{position:absolute;top:12px;inset-inline-end:12px;color:var(--faint);opacity:.55;transition:opacity .2s ease,color .2s ease}
button.kpi:hover .go{opacity:1;color:var(--brand)}
button.kpi.on{box-shadow:0 0 0 2px var(--brand-2),var(--shadow);background:var(--brand-soft)}
button.kpi.on .go{opacity:1;color:var(--brand)}
.kpi .hint{display:block;font-size:11.5px;color:var(--faint);margin-top:6px;min-height:1em}
button.kpi.on .hint{color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);
  border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
html[lang="en"] .kpi .v{letter-spacing:-.02em}
.kpi .u{font-size:12px;color:var(--faint);font-weight:500;margin-inline-start:4px}
.kpi.accent{background:var(--brand-soft);border-color:transparent}
.kpi.accent .v{color:var(--brand)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;font:500 13.5px/1 var(--font);cursor:pointer;border-radius:999px;padding:9px 16px;
  border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);
  transition:transform .1s ease-out,background-color .15s ease,border-color .15s ease,box-shadow .15s ease}
.btn:hover{border-color:color-mix(in srgb,var(--brand-2) 60%,transparent);text-decoration:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--brand-solid);color:var(--brand-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--brand-solid) 88%,#fff)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.glass:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4)}
.btn.small{padding:6px 11px;font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{padding:11px 10px;text-align:start;vertical-align:middle}
th{color:var(--faint);font-weight:600;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{transition:background-color .15s ease}
tr[data-href]{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--brand-soft) 55%,transparent)}
tr.won td{background:var(--brand-soft)}
tr.won td:first-child{box-shadow:inset -3px 0 0 var(--brand-solid)}
html[dir="ltr"] tr.won td:first-child{box-shadow:inset 3px 0 0 var(--brand-solid)}
td .title-link{font-weight:550;color:var(--ink)}
td .title-link:hover{color:var(--brand)}
.na{color:var(--faint);font-size:13px}
.dim{color:var(--muted);font-size:13px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;margin-inline-end:4px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.b-ok{background:var(--green-soft);color:var(--green)}
.b-prov{background:var(--orange-soft);color:var(--orange)}
.b-bad{background:var(--red-soft);color:var(--red)}
.b-win{background:var(--brand-solid);color:#fff}
.b-win::before{background:#fff}
.b-low{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
.b-low::before{display:none}

/* ---------- Filters ---------- */
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-inline-start:40px;height:44px;border-radius:12px;font-size:15px}
input,select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:10px;padding:8px 11px;width:100%;
  transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-2) 22%,transparent)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.row1{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.row1 > label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:190px;flex:0 1 240px}
details.more{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
details.more summary{cursor:pointer;color:var(--brand);font-weight:550;font-size:13.5px;list-style:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:2px}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .25s var(--ease)}
details.more[open] summary svg{transform:rotate(180deg)}
details.more[open] .filters{margin-top:12px;animation:rise .3s var(--ease) both}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border:0;border-radius:999px;
  padding:5px 8px 5px 12px;font:500 12.5px/1 var(--font);cursor:pointer;transition:transform .1s ease-out}
html[dir="rtl"] .chip{padding:5px 12px 5px 8px}
.chip:active{transform:scale(.96)}
.chip svg{width:13px;height:13px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.pager{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}

/* ---------- Detail ---------- */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 24px;margin:0}
.info div{padding:11px 0;border-bottom:1px solid var(--line)}
.info dt{color:var(--faint);font-size:12px;font-weight:500;margin-bottom:2px}
.info dd{margin:0;font-weight:550}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;margin:0 0 14px}
.callout svg{color:var(--brand);margin-top:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:12px;color:var(--brand);font-size:14px;font-weight:500}
.back svg{width:15px;height:15px}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}

/* ---------- Export menu ---------- */
.xmenu{position:relative;display:inline-block;z-index:30}
.xpop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:320px;max-width:calc(100vw - 32px);background:var(--panel);color:var(--ink);
  border-radius:16px;padding:16px;box-shadow:var(--shadow-lift),0 0 0 1px var(--line);transform-origin:top right}
html[dir="rtl"] .xpop{transform-origin:top left}
.xpop[hidden]{display:none}
.xpop.open{animation:pop .24s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.xpop h3{font-size:15px;margin:0 0 4px;font-weight:650}
.xpop .meta{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.xpop .lbl{font-size:12px;color:var(--faint);font-weight:600;margin:0 0 6px}
.xpop .seg{display:flex;margin-bottom:14px}
.xpop .seg > *{flex:1;text-align:center;padding:8px 6px}
.xpop .seg > [disabled]{opacity:.35;cursor:default}
.xpop .btn.primary{width:100%;justify-content:center;padding:11px}
.match{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;color:var(--muted);font-size:13px}
.match b{color:var(--ink)}
#view.busy{opacity:.55;transition:opacity .15s ease;pointer-events:none}

/* ---------- Feedback ---------- */
.empty,.error{padding:36px 12px;text-align:center;color:var(--muted)}
.error{color:var(--red)}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 40%,var(--panel) 80%);background-size:200% 100%;
  animation:shimmer 1.4s ease-in-out infinite;border:1px solid var(--line)}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px) scale(.96);opacity:0;z-index:50;pointer-events:none;
  background:color-mix(in srgb,var(--ink) 88%,transparent);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;
  display:flex;align-items:center;gap:8px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:opacity .25s var(--ease),transform .35s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.print-head{display:none}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  .grid{grid-template-columns:1fr}
  .brand-text span{display:none}
  .hero{padding:22px 20px}
  .hero h1{font-size:24px}
}
@media (max-width:600px){
  .bar{flex-wrap:wrap;gap:10px}
  .bar nav{order:3;width:100%}
  .bar nav.seg{display:flex}
  .bar nav.seg > *{flex:1;text-align:center}
  .brand-text{display:none}
  h1{font-size:23px}
  .kpi .v{font-size:21px}
  .card{padding:16px}
  .tbl-wrap table{min-width:640px}
}

/* ---------- Accessibility ---------- */
@media (prefers-reduced-motion: reduce){
  button.kpi:hover{transform:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #view.enter{animation:fade .2s linear both!important}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card.hover:hover{transform:none}
}
@media (prefers-reduced-transparency: reduce){
  header.top{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none}
  .pill,.btn.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.22)}
}
@media (prefers-contrast: more){
  .card,.kpi{border:1px solid var(--line-strong)}
  th,td{border-bottom-color:var(--line-strong)}
}

/* ---------- Print / PDF ---------- */
@media print{
  :root{--bg:#fff;--panel:#fff;--panel-2:#fff;--ink:#000;--muted:#444;--faint:#555;--line:#ddd;--line-strong:#bbb;
    --brand:#223668;--brand-solid:#223668;--brand-2:#5b7cc4;--brand-soft:#eef3fa;--bar-bad:#c9ced8}
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:11.5px}
  header.top,.no-print,.xmenu,.actions,.form-actions,details.more,.pager,.chips,.back,.toast,.icon-btn{display:none!important}
  .print-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #223668;padding-bottom:10px;margin-bottom:16px}
  .print-head .mark{width:40px;height:40px;box-shadow:none}
  .print-head .t{text-align:end}
  .print-head b{display:block;font-size:15px;color:#223668}
  .print-head span{font-size:11px;color:#555}
  main{padding:0;max-width:none}
  #view.enter{animation:none}
  .card,.kpi{box-shadow:none;border:1px solid #ddd;transform:none!important}

<script>
/* Published (GitHub Pages) mode for the ETIMAD dashboard.
 *
 * The page is public, the data is not: data.enc.json holds the database encrypted with
 * AES-256-GCM under a random data key. That key is wrapped once per dashboard user with a
 * key derived from the user's password (the same PBKDF2 settings as users.json), so the
 * same usernames and passwords open it. Nothing is sent anywhere; decryption is in-browser.
 *
 * window.ETIMAD_STATIC(path, params) answers the dashboard's /api/* calls with the same
 * results server.py would return, computed from the decrypted data.
 */
(() => {
  'use strict';
  const DATA_URL = 'data.enc.json';
  const SS_KEY = 'etimad_site_session';
  const enc = new TextEncoder();
  const hexBytes = h => Uint8Array.from((h || '').match(/../g) || [], x => parseInt(x, 16));
  const b64Bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const bytesB64 = u => btoa(String.fromCharCode(...u));
  const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  const concat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };
  const ss = {get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
              set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
              del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }};

  let envelope = null, DB = null, who = null, resolveUnlock;
  const unlocked = new Promise(r => { resolveUnlock = r; });

  /* ---------------- crypto ---------------- */
  async function aesOpen(rawKey, iv, ct) {
    const k = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv}, k, ct));
  }
  async function unwrapKey(username, password) {
    const id = toHex(await crypto.subtle.digest('SHA-256', enc.encode(username.trim().toLowerCase())));
    const u = envelope.users.find(x => x.id === id);
    if (!u) return null;
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      {name: 'PBKDF2', salt: hexBytes(u.salt), iterations: u.iterations, hash: 'SHA-256'}, base, 256));
    const kek = new Uint8Array(await crypto.subtle.digest('SHA-256', concat(enc.encode('etimad-site-kek:'), bits)));
    try { return await aesOpen(kek, b64Bytes(u.iv), b64Bytes(u.wk)); } catch (e) { return null; }
  }
  async function openData(dataKey) {
    const plain = await aesOpen(dataKey, b64Bytes(envelope.iv), b64Bytes(envelope.ct));
    const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(stream).text());
  }

  /* ---------------- SQL-compatible helpers ---------------- */
  // SQLite ordering: NULL sorts lowest.
  const cmp = (a, b, dir = 1) => {
    const an = a == null, bn = b == null;
    if (an || bn) return an === bn ? 0 : (an ? -1 : 1) * dir;
    return (a < b ? -1 : a > b ? 1 : 0) * dir;
  };
  // "ORDER BY x IS NULL, x <dir>": NULLs last in both directions.
  const cmpNullsLast = (a, b, dir = 1) => {
    const an = a == null, bn = b == null;
    if (an || bn) return an === bn ? 0 : (an ? 1 : -1);
    return cmp(a, b, dir);
  };
  const like = (hay, needle) => hay != null && String(hay).toLowerCase().includes(needle.toLowerCase());
  const sum = xs => { let s = 0, c = 0, n = 0; for (const x of xs) if (x != null) { n++; const t = s + x; c += Math.abs(s) >= Math.abs(x) ? (s - t) + x : (x - t) + s; s = t; } return n ? s + c : null; };
  const p = (q, k) => (q[k] == null ? '' : String(q[k])).trim();
  const int = v => { const n = Number(v); if (!Number.isInteger(n)) throw new Error('bad parameter'); return n; };
  const num = v => { const n = Number(v); if (!Number.isFinite(n)) throw new Error('bad parameter'); return n; };
  const d10 = v => v == null ? null : String(v).slice(0, 10);

  /* ---------------- index ---------------- */
  function index(d) {
    const ent = new Map(d.entities.map(e => [e.id, e.name]));
    const com = new Map(d.companies.map(c => [c.id, c.name]));
    const bidsBy = new Map(), awardsBy = new Map();
    d.tenders.forEach(t => { bidsBy.set(t.id, []); awardsBy.set(t.id, []); });
    d.bids.forEach(b => (bidsBy.get(b.tender_id) || []).push(b));
    d.awards.forEach(a => (awardsBy.get(a.tender_id) || []).push(a));
    const base = d.tenders.map(t => {
      const bs = bidsBy.get(t.id), as = awardsBy.get(t.id);
      const offers = bs.map(b => b.offer_value).filter(v => v != null);
      const okOffers = bs.filter(b => b.technical_result === 'مطابق' && b.offer_value != null).map(b => b.offer_value);
      const statuses = as.map(a => a.status).filter(s => s != null).sort();
      return {
        id: t.id, stender_id: t.stender_id, title: t.title, reference_number: t.reference_number,
        tender_number: t.tender_number, tender_type: t.tender_type, status: t.status, activity: t.activity,
        execution_location: t.execution_location, bid_opening_date: t.bid_opening_date,
        first_seen_at: t.first_seen_at, last_verified_at: t.last_verified_at, source_url: t.source_url,
        entity_id: t.entity_id, entity: t.entity_id == null ? null : (ent.get(t.entity_id) ?? null),
        bid_count: bs.length,
        lowest_bid: offers.length ? Math.min(...offers) : null,
        lowest_compliant: okOffers.length ? Math.min(...okOffers) : null,
        winners: as.length ? as.map(a => com.get(a.company_id)).join(' ، ') : null,
        award_value: as.length ? sum(as.map(a => a.award_value)) : null,
        award_status: statuses.length ? statuses[0] : null
      };
    });
    return {d, ent, com, bidsBy, awardsBy, base, baseById: new Map(base.map(r => [r.id, r])),
            tenderById: new Map(d.tenders.map(t => [t.id, t]))};
  }

  /* ---------------- filters (mirror server.build_filter) ---------------- */
  function filterRows(q) {
    const conds = [];
    const bidCos = id => DB.bidsBy.get(id) || [], awCos = id => DB.awardsBy.get(id) || [];
    if (p(q, 'q')) {
      const s = p(q, 'q');
      conds.push(x => like(x.title, s) || like(x.reference_number, s) || like(x.tender_number, s) || like(x.entity, s)
        || bidCos(x.id).some(b => like(DB.com.get(b.company_id), s)));
    }
    if (p(q, 'entity')) { const e = int(p(q, 'entity')); conds.push(x => x.entity_id === e); }
    if (p(q, 'company')) {
      const c = int(p(q, 'company'));
      conds.push(x => bidCos(x.id).some(b => b.company_id === c) || awCos(x.id).some(a => a.company_id === c));
    }
    if (p(q, 'company_name')) {
      const s = p(q, 'company_name');
      conds.push(x => bidCos(x.id).some(b => like(DB.com.get(b.company_id), s)) || awCos(x.id).some(a => like(DB.com.get(a.company_id), s)));
    }
    if (p(q, 'activity')) { const v = p(q, 'activity'); conds.push(x => x.activity === v); }
    if (p(q, 'type')) { const v = p(q, 'type'); conds.push(x => x.tender_type === v); }
    if (p(q, 'location')) { const v = p(q, 'location'); conds.push(x => like(x.execution_location, v)); }
    if (p(q, 'award') === 'awarded') conds.push(x => x.winners != null);
    else if (p(q, 'award') === 'none') conds.push(x => x.winners == null);
    if (['confirmed', 'provisional'].includes(p(q, 'astatus'))) { const v = p(q, 'astatus'); conds.push(x => x.award_status === v); }
    for (const [key, col, ge] of [['from', 'bid_opening_date', true], ['to', 'bid_opening_date', false],
                                  ['sfrom', 'first_seen_at', true], ['sto', 'first_seen_at', false]]) {
      if (p(q, key)) { const v = p(q, key); conds.push(x => { const d = d10(x[col]); return d != null && (ge ? d >= v : d <= v); }); }
    }
    if (p(q, 'min')) { const v = num(p(q, 'min')); conds.push(x => x.award_value != null && x.award_value >= v); }
    if (p(q, 'max')) { const v = num(p(q, 'max')); conds.push(x => x.award_value != null && x.award_value <= v); }
    return {rows: DB.base.filter(x => conds.every(f => f(x))), filtered: conds.length > 0};
  }
  const labels = q => p(q, 'company') ? {company: DB.com.get(int(p(q, 'company'))) ?? null} : {};
  const SORTS = {opening: 'bid_opening_date', value: 'award_value', seen: 'first_seen_at', bids: 'bid_count'};

  /* ---------------- endpoints (mirror server.py) ---------------- */
  function apiTenders(q) {
    const {rows} = filterRows(q);
    const sort = SORTS[p(q, 'sort')] || 'bid_opening_date';
    const dir = p(q, 'dir') === 'asc' ? 1 : -1;
    const size = Math.max(1, Math.min(int(p(q, 'size') || 25), 50000));
    const page = Math.max(1, int(p(q, 'page') || 1));
    const sorted = [...rows].sort((a, b) => cmpNullsLast(a[sort], b[sort], dir) || b.id - a.id);
    return {total: rows.length, page, size, rows: sorted.slice((page - 1) * size, page * size), labels: labels(q)};
  }

  function awardsIn(ids) { return DB.d.awards.filter(a => ids.has(a.tender_id)); }
  function bidsIn(ids) { return DB.d.bids.filter(b => ids.has(b.tender_id)); }

  function apiStats(q) {
    const {rows, filtered} = filterRows(q);
    const ids = new Set(rows.map(r => r.id));
    const bids = bidsIn(ids), awards = awardsIn(ids);
    const conf = awards.filter(a => a.status === 'confirmed');
    const group = (items, keyFn) => { const m = new Map(); items.forEach(i => { const k = keyFn(i); if (!m.has(k)) m.set(k, []); m.get(k).push(i); }); return m; };

    const daily = [...group(awards, a => d10(a.first_seen_at))].map(([d, xs]) => ({d, n: xs.length})).sort((a, b) => cmp(a.d, b.d));
    const topCompanies = [...group(conf, a => a.company_id)].map(([id, xs]) => ({id, name: DB.com.get(id), awards: xs.length, value: sum(xs.map(a => a.award_value))}))
      .sort((a, b) => cmp(a.awards, b.awards, -1) || cmp(a.value, b.value, -1) || a.id - b.id).slice(0, 10);
    const withEntity = conf.filter(a => DB.tenderById.get(a.tender_id).entity_id != null && DB.ent.has(DB.tenderById.get(a.tender_id).entity_id));
    const topEntities = [...group(withEntity, a => DB.tenderById.get(a.tender_id).entity_id)]
      .map(([id, xs]) => ({id, name: DB.ent.get(id), awards: xs.length, value: sum(xs.map(a => a.award_value))}))
      .sort((a, b) => cmp(a.value, b.value, -1) || a.id - b.id).slice(0, 10);
    const withAct = conf.filter(a => DB.tenderById.get(a.tender_id).activity != null);
    const byActivity = [...group(withAct, a => DB.tenderById.get(a.tender_id).activity)].map(([activity, xs]) => {
      const vals = xs.map(a => a.award_value).filter(v => v != null);
      return {activity, awards: xs.length, avg_value: vals.length ? sum(vals) / vals.length : null};
    }).sort((a, b) => cmp(a.awards, b.awards, -1) || cmp(a.activity, b.activity)).slice(0, 10);
    const latest = [...awards].sort((a, b) => cmp(a.first_seen_at, b.first_seen_at, -1) || b.id - a.id).slice(0, 10).map(a => {
      const t = DB.tenderById.get(a.tender_id);
      return {tender_id: t.id, title: t.title, entity: t.entity_id == null ? null : (DB.ent.get(t.entity_id) ?? null),
              company_id: a.company_id, company: DB.com.get(a.company_id), award_value: a.award_value, status: a.status, first_seen_at: a.first_seen_at};
    });
    const companies = new Set([...bids.map(b => b.company_id), ...awards.map(a => a.company_id)]);
    return {
      filtered, labels: labels(q),
      totals: {tenders: ids.size, bids: bids.length, companies: companies.size, confirmed_awards: conf.length,
               confirmed_value: sum(conf.map(a => a.award_value)) ?? 0,
               provisional_awards: awards.filter(a => a.status != null && a.status !== 'confirmed').length},
      daily, top_companies: topCompanies, top_entities: topEntities, by_activity: byActivity, latest, runs: DB.d.runs
    };
  }

  function apiExport(q) {
    const {rows} = filterRows(q);
    const ids = new Set(rows.map(r => r.id));
    const kind = p(q, 'kind');
    const t = id => DB.tenderById.get(id), b = id => DB.baseById.get(id);
    const entName = tt => tt.entity_id == null ? null : (DB.ent.get(tt.entity_id) ?? null);
    if (kind === 'bids') {
      const out = bidsIn(ids).sort((x, y) => cmp(t(x.tender_id).bid_opening_date, t(y.tender_id).bid_opening_date, -1)
        || x.tender_id - y.tender_id || cmpNullsLast(x.offer_value, y.offer_value) || x.id - y.id).slice(0, 50000).map(x => {
        const tt = t(x.tender_id), aw = (DB.awardsBy.get(x.tender_id) || []).find(a => a.company_id === x.company_id);
        return {reference_number: tt.reference_number, tender_number: tt.tender_number, title: tt.title, entity: entName(tt),
                tender_type: tt.tender_type, activity: tt.activity, bid_opening_date: tt.bid_opening_date,
                company: DB.com.get(x.company_id), offer_value: x.offer_value, technical_result: x.technical_result,
                tender_lowest: b(x.tender_id).lowest_bid, tender_lowest_compliant: b(x.tender_id).lowest_compliant,
                award_value: aw ? aw.award_value : null, award_status: aw ? aw.status : null, source_url: tt.source_url};
      });
      return {rows: out};
    }
    if (kind === 'awards') {
      const out = awardsIn(ids).sort((x, y) => cmp(x.first_seen_at, y.first_seen_at, -1) || y.id - x.id).slice(0, 50000).map(a => {
        const tt = t(a.tender_id);
        return {reference_number: tt.reference_number, tender_number: tt.tender_number, title: tt.title, entity: entName(tt),
                tender_type: tt.tender_type, activity: tt.activity, execution_location: tt.execution_location,
                bid_opening_date: tt.bid_opening_date, company: DB.com.get(a.company_id), award_type: a.award_type,
                offer_value: a.offer_value, award_value: a.award_value, award_status: a.status,
                first_seen_at: a.first_seen_at, source_url: tt.source_url};
      });
      return {rows: out};
    }
    throw new Error('bad parameter');
  }

  function apiTender(q) {
    const id = int(p(q, 'id'));
    const tt = DB.tenderById.get(id);
    if (!tt) throw new Error('not found');
    const {snapshots, ...tender} = tt;
    tender.entity = tt.entity_id == null ? null : (DB.ent.get(tt.entity_id) ?? null);
    return {
      tender,
      bids: [...(DB.bidsBy.get(id) || [])].sort((a, b) => cmpNullsLast(a.offer_value, b.offer_value) || a.id - b.id).map(b => ({
        company_id: b.company_id, company: DB.com.get(b.company_id), offer_value: b.offer_value,
        technical_result: b.technical_result, first_seen_at: b.first_seen_at, last_verified_at: b.last_verified_at})),
      awards: [...(DB.awardsBy.get(id) || [])].sort((a, b) => a.id - b.id).map(a => ({
        company_id: a.company_id, company: DB.com.get(a.company_id), award_type: a.award_type, offer_value: a.offer_value,
        award_value: a.award_value, status: a.status, first_seen_at: a.first_seen_at, last_verified_at: a.last_verified_at})),
      changes: DB.d.changes.filter(c => c.tender_id === id).sort((a, b) => b.id - a.id).slice(0, 50)
        .map(c => ({field: c.field, old_value: c.old_value, new_value: c.new_value, changed_at: c.changed_at})),
      snapshots: snapshots || 0
    };
  }

  function apiCompany(q) {
    const id = int(p(q, 'id'));
    if (!DB.com.has(id)) throw new Error('not found');
    const entName = tt => tt.entity_id == null ? null : (DB.ent.get(tt.entity_id) ?? null);
    return {
      company: {id, name: DB.com.get(id)},
      bids: DB.d.bids.filter(b => b.company_id === id).sort((a, b) => cmp(DB.tenderById.get(a.tender_id).bid_opening_date, DB.tenderById.get(b.tender_id).bid_opening_date, -1) || a.tender_id - b.tender_id || a.id - b.id).map(b => {
        const tt = DB.tenderById.get(b.tender_id), aw = (DB.awardsBy.get(b.tender_id) || []).find(a => a.company_id === id);
        return {tender_id: tt.id, title: tt.title, bid_opening_date: tt.bid_opening_date, entity: entName(tt),
                offer_value: b.offer_value, technical_result: b.technical_result, won_value: aw ? aw.award_value : null,
                bid_count: (DB.bidsBy.get(tt.id) || []).length};
      }),
      awards: DB.d.awards.filter(a => a.company_id === id).sort((a, b) => cmp(a.first_seen_at, b.first_seen_at, -1) || b.id - a.id).map(a => {
        const tt = DB.tenderById.get(a.tender_id);
        return {tender_id: tt.id, title: tt.title, entity: entName(tt), award_value: a.award_value, award_type: a.award_type,
                status: a.status, first_seen_at: a.first_seen_at};
      })
    };
  }

  function apiOptions() {
    const counts = new Map();
    DB.d.tenders.forEach(t => { if (t.entity_id != null) counts.set(t.entity_id, (counts.get(t.entity_id) || 0) + 1); });
    const distinct = col => [...new Set(DB.d.tenders.map(t => t[col]).filter(v => v != null))].sort((a, b) => cmp(a, b));
    return {
      entities: DB.d.entities.map(e => ({id: e.id, name: e.name, n: counts.get(e.id) || 0})).sort((a, b) => cmp(a.name, b.name)),
      activities: distinct('activity'), types: distinct('tender_type')
    };
  }

  const ROUTES = {'/api/tenders': apiTenders, '/api/stats': apiStats, '/api/export': apiExport,
                  '/api/tender': apiTender, '/api/company': apiCompany, '/api/options': apiOptions,
                  '/api/me': () => ({user: who, role: 'viewer'})};

  window.ETIMAD_STATIC = async (path, params = {}) => {
    await unlocked;
    const fn = ROUTES[path];
    if (!fn) throw new Error('not found');
    const q = {};
    Object.entries(params).forEach(([k, v]) => { if (v !== '' && v != null) q[k] = String(v); });
    return JSON.parse(JSON.stringify(fn(q)));   // hand out copies, like a fresh server response
  };

  /* ---------------- unlock screen ---------------- */
  const TXT = {
    ar: {title: 'نتائج منافسات اعتماد', sub: 'سجّل الدخول للمتابعة', user: 'اسم المستخدم', pass: 'كلمة المرور',
         go: 'تسجيل الدخول', wait: 'جارٍ فتح البيانات…', bad: 'اسم المستخدم أو كلمة المرور غير صحيحة.',
         empty: 'أدخل اسم المستخدم وكلمة المرور.', net: 'تعذر تحميل البيانات. حدّث الصفحة وحاول مرة أخرى.',
         old: 'هذا المتصفح قديم ولا يدعم فتح البيانات المشفرة.', upd: 'آخر تحديث', other: 'English'},
    en: {title: 'ETIMAD Tender Results', sub: 'Sign in to continue', user: 'Username', pass: 'Password',
         go: 'Sign in', wait: 'Opening data…', bad: 'Incorrect username or password.',
         empty: 'Enter your username and password.', net: 'Could not load the data. Refresh and try again.',
         old: 'This browser is too old to open the encrypted data.', upd: 'Last updated', other: 'العربية'}
  };
  const L = () => TXT[document.documentElement.lang === 'en' ? 'en' : 'ar'];

  const style = document.createElement('style');
  style.textContent = `
  #unlock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px 16px;overflow:auto;background:var(--bg);
    background-image:radial-gradient(1200px 600px at 50% -10%,color-mix(in srgb,var(--brand-2) 16%,transparent),transparent 70%)}
  #unlock .box{width:100%;max-width:380px;animation:rise .45s var(--ease) both}
  #unlock .mk{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 18px;box-shadow:0 6px 18px rgba(34,54,104,.25)}
  #unlock h1{font-size:24px;text-align:center;margin:0 0 6px} #unlock .s{color:var(--muted);text-align:center;margin:0 0 26px;font-size:14px}
  #unlock form{background:var(--panel);border-radius:20px;padding:22px;box-shadow:var(--shadow-lift);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
  #unlock label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px}
  #unlock input{font-size:16px;padding:12px 14px;border-radius:12px;margin-bottom:16px}
  #unlock .go{width:100%;justify-content:center;padding:14px;border-radius:12px;font-size:15px}
  #unlock .err{display:none;background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 14px}
  #unlock .err.show{display:block}
  #unlock .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--faint);font-size:12px}
  #unlock .lg{border:0;background:transparent;color:var(--muted);font:500 13px var(--font);cursor:pointer;padding:6px 8px}`;
  document.head.appendChild(style);

  const box = document.createElement('div');
  box.id = 'unlock';
  box.setAttribute('role', 'dialog');
  box.innerHTML = `<div class="box">
    <svg class="mk" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#223668"/>
      <rect x="8" y="16" width="4" height="8" rx="1.5" fill="#fff"/><rect x="14" y="11" width="4" height="13" rx="1.5" fill="#fff" opacity=".85"/>
      <rect x="20" y="7" width="4" height="17" rx="1.5" fill="#fff" opacity=".7"/></svg>
    <h1 data-u="title"></h1><p class="s" data-u="sub"></p>
    <form autocomplete="on" novalidate>
      <div class="err" role="alert"></div>
      <label for="uu" data-u="user"></label><input id="uu" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label for="up" data-u="pass"></label><input id="up" type="password" autocomplete="current-password">
      <button class="btn primary go" type="submit" data-u="go"></button>
    </form>
    <div class="foot"><span class="upd"></span><button class="lg" type="button"></button></div></div>`;
  document.body.appendChild(box);
  const errEl = box.querySelector('.err'), goBtn = box.querySelector('.go');

  function paint() {
    const t = L();
    box.querySelectorAll('[data-u]').forEach(el => { el.textContent = t[el.dataset.u]; });
    box.querySelector('.lg').textContent = t.other;
    box.querySelector('.upd').textContent = envelope ? `${t.upd}: ${String(envelope.generated_at).replace('T', ' ').slice(0, 16)}` : '';
  }
  const fail = msg => { errEl.textContent = msg; errEl.classList.add('show'); };
  box.querySelector('.lg').addEventListener('click', () => {
    const b = document.getElementById('langBtn');
    if (b) b.click();                      // the dashboard switches language and remembers it
    setTimeout(paint, 0);
  });

  async function finish(dataKey, username) {
    DB = index(await openData(dataKey));
    who = username;
    ss.set(SS_KEY, JSON.stringify({k: bytesB64(dataKey), g: envelope.generated_at, u: username}));
    box.remove();
    resolveUnlock();
  }

  box.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!envelope) return;
    const u = box.querySelector('#uu').value.trim(), pw = box.querySelector('#up').value;
    if (!u || !pw) return fail(L().empty);
    goBtn.disabled = true; goBtn.textContent = L().wait; errEl.classList.remove('show');
    try {
      const key = await unwrapKey(u, pw);
      if (!key) { fail(L().bad); box.querySelector('#up').value = ''; box.querySelector('#up').focus(); }
      else await finish(key, u.toLowerCase());
    } catch (x) { fail(L().net); }
    goBtn.disabled = false; goBtn.textContent = L().go;
  });

  // Sign-out on the published copy: forget this tab's key and lock again.
  document.addEventListener('click', e => {
    if (e.target.closest('#logoutBtn')) { e.preventDefault(); ss.del(SS_KEY); location.reload(); }
  }, true);

  (async () => {
    paint();
    if (!(window.crypto && crypto.subtle && window.DecompressionStream)) { fail(L().old); goBtn.disabled = true; return; }
    try {
      const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'});
      if (!r.ok) throw new Error(r.status);
      envelope = await r.json();
    } catch (x) { fail(L().net); goBtn.disabled = true; return; }
    paint();
    try {
      const saved = JSON.parse(ss.get(SS_KEY) || 'null');
      if (saved && saved.g === envelope.generated_at) { await finish(b64Bytes(saved.k), saved.u); return; }
    } catch (x) { ss.del(SS_KEY); }
    box.querySelector('#uu').focus();
  })();
})();

  if (window.ETIMAD_STATIC) return window.ETIMAD_STATIC(path, params);   // published (GitHub Pages) build
  const u = new URL(path, location.origin);
  for (const [k, v] of Object.entries(params)) if (v !== '' && v != null) u.searchParams.set(k, v);
  const r = await fetch(u, {credentials: 'same-origin'});
  if (r.status === 401) { location.href = '/login'; throw new Error(t('loading')); }
  if (!r.ok) {
    let msg = r.status;
    try { msg = (await r.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

function parseHash() {

  const [path, qs] = h.split('?');
  return {path, params: Object.fromEntries(new URLSearchParams(qs || ''))};
}

let lastPath = null;
let lastFilters = {};
async function route(keepScroll) {
  const {path, params} = parseHash();
  if (path === '/' || path === '/tenders') lastFilters = pickFilters(params);
  document.querySelectorAll('nav [data-nav]').forEach(a => {
    const n = a.dataset.nav;
    a.classList.toggle('on', n === '/' ? path === '/' : path.startsWith('/tender') || path.startsWith('/company'));
    a.setAttribute('href', '#' + n + qs(lastFilters));
  });
  const v = $('#view');
  const y = window.scrollY;
  const samePage = path === lastPath;
  lastPath = path;
  if (samePage) { keepScroll = true; v.classList.add('busy'); }
  else { v.classList.remove('enter'); v.innerHTML = skeleton(); }
  const old = charts; charts = [];
  try {
    if (path.startsWith('/tender/')) await viewTender(path.split('/')[2]);
    else if (path.startsWith('/company/')) await viewCompany(path.split('/')[2]);
    else if (path === '/tenders') await viewTenders(params);
    else await viewOverview(params);
  } catch (e) {
    v.innerHTML = `<div class="card error">${t('error')}: ${esc(e.message)}</div>`;
  }
  old.forEach(c => c.destroy());
  v.classList.remove('busy');
  if (!samePage) { void v.offsetWidth; v.classList.add('enter'); }
  window.scrollTo(0, keepScroll === true ? y : 0);
  $('#phTitle').textContent = t('brand_full');
}

function makeChart(id, type, labels, datasets, extra = {}) {
  const fg = css('--muted'), grid = css('--line');
  const horizontal = extra.indexAxis === 'y';
  const rtl = lang === 'ar';
  const integer = extra.integer; delete extra.integer;
  const valueAxis = horizontal ? 'x' : 'y';
  const font = {family: FONT, size: 12};
  const hint = extra.hint; delete extra.hint;
  const canvas = document.getElementById(id);
  if (!labels.length) {
    canvas.parentElement.innerHTML = `<div class="empty">${t('nothing_here')}</div>`;
    return null;
  }
  const chart = new Chart(canvas, {
    type,
    data: {labels, datasets},
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: reduced() ? false : {duration: 600, easing: 'easeOutQuart'},
      transitions: {resize: {animation: {duration: 0}}},
      layout: {padding: {left: 6, right: 6, top: 4}},
      interaction: {mode: 'nearest', intersect: false, axis: horizontal ? 'y' : 'x'},
      onHover: (e, els) => { e.native.target.style.cursor = els.length && extra.onClick ? 'pointer' : 'default'; },
      plugins: {
        legend: {display: datasets.length > 1, labels: {color: fg, font}},
        tooltip: {rtl, textDirection: rtl ? 'rtl' : 'ltr', backgroundColor: 'rgba(29,29,31,.92)', padding: 10, cornerRadius: 10,
          titleFont: {family: FONT, size: 12, weight: '600'}, bodyFont: {family: FONT, size: 12}, displayColors: false,
          callbacks: {label: c => `${c.dataset.label}: ${integer ? fmtInt(c.raw) : fmt(c.raw)}`, footer: () => hint || ''},
          footerFont: {family: FONT, size: 11, weight: '500'}, footerColor: 'rgba(255,255,255,.7)'}
      },
      scales: {
        x: {reverse: horizontal && rtl, ticks: {color: fg, font}, grid: {color: horizontal ? grid : 'transparent'}, border: {display: false}},
        y: {position: horizontal && rtl ? 'right' : 'left', beginAtZero: true, ticks: {color: fg, font},
            grid: {color: horizontal ? 'transparent' : grid}, border: {display: false}}
      },
      ...extra
    }
  });
  const ticks = chart.options.scales[valueAxis].ticks;
  if (integer) ticks.precision = 0;
  else ticks.callback = v => Number(v).toLocaleString('en-US', {notation: 'compact', maximumFractionDigits: 1});

}

function groupDaily(daily, g) {
  const m = new Map();
  for (const {d, n} of daily) {
    if (!d) continue;
    let k = d;
    if (g === 'month') k = d.slice(0, 7);
    if (g === 'week') {
      const x = new Date(d + 'T00:00:00Z');
      x.setUTCDate(x.getUTCDate() - x.getUTCDay());
      k = x.toISOString().slice(0, 10);
    }
    m.set(k, (m.get(k) || 0) + n);
  }
  return [...m.entries()];
}

/* KPI count-up — eases into place from 0 */
function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(el => {
    const target = Number(el.dataset.count), dec = Number(el.dataset.dec || 0);
    const show = v => el.textContent = v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
    if (reduced() || !target) return show(target);
    const t0 = performance.now(), dur = 750;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      show(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

document.addEventListener('click', e => {
  const trigger = e.target.closest('.xmenu > button');
  const pop = e.target.closest('.xpop');
  if (trigger) {
    const p = trigger.nextElementSibling;
    const willOpen = p.hidden;
    closeMenus(p);
    p.hidden = !willOpen;
    p.classList.toggle('open', willOpen);
    trigger.setAttribute('aria-expanded', String(willOpen));
    if (willOpen) {
      const n = exportCtx ? exportCtx.count : 0;
      p.querySelector('.meta').textContent = exportCtx && exportCtx.filtered
        ? `${t('matches_n')}: ${fmtInt(n)} ${t('tenders_word')}` : `${t('matches_all')} (${fmtInt(n)} ${t('tenders_word')})`;
      syncFmt(p);
    }
    return;
  }
  if (pop) {
    const choice = e.target.closest('[data-pick] > button');
    if (choice && !choice.disabled) {
      choice.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === choice));
      syncFmt(pop);
    }
    const go = e.target.closest('[data-go]');
    if (go) {
      const kind = pop.querySelector('[data-pick=kind] .on').dataset.v;
      const fmtSel = pop.querySelector('[data-pick=fmt] .on').dataset.v;
      busy(go, () => runExport(kind, fmtSel)).then(() => closeMenus());
    }
    return;
  }
  closeMenus();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });
function syncFmt(pop) {
  const summary = pop.querySelector('[data-pick=kind] .on').dataset.v === 'summary';
  const csv = pop.querySelector('[data-pick=fmt] [data-v=csv]');
  csv.disabled = summary;
  if (summary && csv.classList.contains('on')) {
    csv.classList.remove('on');
    pop.querySelector('[data-pick=fmt] [data-v=xlsx]').classList.add('on');
  }
}
async function runExport(kind, fmtSel) {
  const f = exportCtx.filters;
  const base = `etimad-${kind}${exportCtx.filtered ? '-filtered' : ''}`;
  let rows, title = t('x_' + kind);
  if (kind === 'summary') {
    const s = exportCtx.stats, k = s.totals;
    return exportXlsx([
      {name: t('sheet_kpis'), title: t('sheet_kpis'), rows: [
        [t('k_tenders'), k.tenders], [t('k_bids'), k.bids], [t('k_companies'), k.companies],
        [t('k_confirmed'), k.confirmed_awards], [t('k_value') + ' (' + t('sar') + ')', k.confirmed_value], [t('k_prov'), k.provisional_awards]
      ].map(([a, b]) => ({[t('metric')]: a, [t('value')]: b}))},
      {name: t('sheet_companies'), title: t('top_companies'), rows: s.top_companies.map(r => ({[t('col_company')]: r.name, [t('awards_n')]: r.awards, [t('value')]: r.value}))},
      {name: t('sheet_entities'), title: t('top_entities'), rows: s.top_entities.map(r => ({[t('col_entity')]: r.name, [t('awards_n')]: r.awards, [t('value')]: r.value}))},
      {name: t('col_activity'), title: t('avg_activity'), rows: s.by_activity.map(r => ({[t('col_activity')]: r.activity, [t('awards_n')]: r.awards, [t('avg')]: r.avg_value}))},
      filtersSheet(f)
    ], base);
  }
  if (kind === 'tenders') rows = rowsForExport((await api('/api/tenders', {...f, sort: exportCtx.sort, dir: exportCtx.dir, page: 1, size: 50000})).rows);
  if (kind === 'bids') rows = bidRows((await api('/api/export', {...f, kind: 'bids'})).rows);
  if (kind === 'awards') rows = awardRows((await api('/api/export', {...f, kind: 'awards'})).rows);
  if (fmtSel === 'csv') return exportCsv(rows, base);
  exportXlsx([{name: title, title: `${title} — ${fmtInt(rows.length)}`, rows}, filtersSheet(f)], base);
}

/* ---------- Interactive KPI ---------- */
function kpiBtn(label, value, opts) {
  const on = opts.active;
  const hint = opts.toggle ? (on ? t('filtering') : t('click_filter')) : t('click_open');
  return `<button type="button" class="kpi ${opts.accent ? 'accent' : ''} ${on ? 'on' : ''}" ${opts.attr} title="${hint}" aria-pressed="${on ? 'true' : 'false'}">
    <span class="go">${icon(opts.toggle ? 'filter' : 'go')}</span>
    <div class="l">${t(label)}</div>
    <div class="v"><span data-count="${Number(value) || 0}" data-dec="${opts.dec || 0}">0</span>${opts.unit ? `<span class="u">${t(opts.unit)}</span>` : ''}</div>
    <span class="hint">${on ? hint : ''}</span></button>`;
}

      {integer: true, hint: t('click_filter'), onClick: (e, els) => {

    </section>`;

  if (priced.length) {
    const sorted = [...priced].sort((a, b) => a.offer_value - b.offer_value);
    const color = b => awarded.has(b.company_id) ? css('--brand-solid') : (b.technical_result === 'مطابق' ? css('--brand-2') : css('--bar-bad'));
    const colors = sorted.map(color);
    makeChart('cBids', 'bar', sorted.map(b => short(b.company, 24)),
      [{label: t('col_offer'), data: sorted.map(b => b.offer_value), backgroundColor: colors, hoverBackgroundColor: colors, borderRadius: 6, borderSkipped: false, maxBarThickness: 46}],
      {onClick: (e, els) => { if (els.length) location.hash = '#/company/' + sorted[els[0].index].company_id; }});
  }

  $('#prnBtn').addEventListener('click', printPage);
  $('#bidsBtn').addEventListener('click', () => {
    const order = [...d.bids];
    exportXlsx([
      {name: t('sheet_bids'), title: x.title || '', rows: order.map((b, i) => ({
        '#': i + 1, [t('col_company')]: b.company, [t('col_offer')]: b.offer_value, [t('col_tech')]: techText(b.technical_result),
        [t('col_winner')]: awarded.has(b.company_id) ? t('b_winner') : '',
        [t('col_details')]: [b.offer_value === lowest ? t('b_lowest') : '', b.offer_value === lowestC && b.technical_result === 'مطابق' ? t('b_lowest_c') : ''].filter(Boolean).join(' · ')
      }))},
      {name: t('sheet_awards'), title: x.title || '', rows: d.awards.map(a => ({
        [t('col_company')]: a.company, [t('col_award_type')]: a.award_type, [t('col_offer')]: a.offer_value,
        [t('col_award')]: a.award_value, [t('col_status')]: t(a.status), [t('col_source')]: x.source_url
      }))}
    ], `tender-${x.reference_number || x.id}`);
  });
}

/* ---------- Company ---------- */
async function viewCompany(id) {
  const d = await api('/api/company', {id});
  const confirmed = d.awards.filter(a => a.status === 'confirmed');
  const total = confirmed.reduce((s, a) => s + (a.award_value || 0), 0);
  const wins = d.bids.filter(b => isNum(b.won_value)).length;
  const rate = d.bids.length ? Math.round(100 * wins / d.bids.length) : 0;

  $('#view').innerHTML = `
    <a class="back no-print" href="javascript:history.back()">${icon('back')}${t('back')}</a>
    <div class="page-head">
      <div><h1>${esc(d.company.name)}</h1><p class="sub"><a href="#/tenders?company=${d.company.id}">${t('company_tenders')}</a></p></div>
      <div class="actions">${exportButtons([['histBtn', 'xlsx', 'export_history'], ['prnBtn', 'print', 'print']])}</div>
    </div>
    <section class="kpis">
      ${kpi('participations', d.bids.length)}${kpi('k_confirmed', confirmed.length, {accent: true})}
      <div class="kpi"><div class="l">${t('win_rate')}</div><div class="v"><span data-count="${rate}">0</span><span class="u">%</span></div></div>
      ${kpi('total_awarded', total, {dec: 2, unit: 'sar', accent: true})}
    </section>
    <section class="grid">
      <div class="card span2"><div class="card-h"><h2>${t('c_awards')} (${d.awards.length})</h2></div>
        ${d.awards.length ? `<div class="tbl-wrap"><table><thead><tr><th>${t('col_title')}</th><th>${t('col_entity')}</th>
          <th class="num">${t('col_award')}</th><th>${t('col_award_type')}</th><th>${t('col_status')}</th><th>${t('first_seen')}</th></tr></thead><tbody>
          ${d.awards.map(a => `<tr data-href="#/tender/${a.tender_id}"><td><a class="title-link" href="#/tender/${a.tender_id}">${esc(short(a.title, 72))}</a></td><td class="dim">${esc(a.entity || '')}</td>
            <td class="num"><b>${money(a.award_value)}</b></td><td>${esc(a.award_type || '')}</td><td>${statusBadge(a.status)}</td>
            <td class="dim">${dt(a.first_seen_at)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">—</div>`}
      </div>
      <div class="card span2"><div class="card-h"><h2>${t('c_bids')} (${d.bids.length})</h2></div>
        ${d.bids.length ? `<div class="tbl-wrap"><table><thead><tr><th>${t('col_title')}</th><th>${t('col_entity')}</th><th>${t('col_opening')}</th>
          <th class="num">${t('col_offer')}</th><th>${t('col_tech')}</th><th class="num">${t('col_bids')}</th><th>${t('col_result')}</th></tr></thead><tbody>
          ${d.bids.map(b => `<tr class="${isNum(b.won_value) ? 'won' : ''}" data-href="#/tender/${b.tender_id}"><td><a class="title-link" href="#/tender/${b.tender_id}">${esc(short(b.title, 64))}</a></td>
            <td class="dim">${esc(b.entity || '')}</td><td class="dim">${dt(b.bid_opening_date)}</td><td class="num">${money(b.offer_value)}</td>
            <td>${techBadge(b.technical_result)}</td><td class="num">${fmtInt(b.bid_count)}</td>
            <td>${isNum(b.won_value) ? `<span class="badge b-win">${t('won')} · ${fmt(b.won_value)}</span>` : `<span class="dim">${t('not_won')}</span>`}</td>
          </tr>`).join('')}</tbody></table></div>` : `<div class="empty">—</div>`}
      </div>
    </section>`;
  countUp($('#view'));

  $('#prnBtn').addEventListener('click', printPage);
  $('#histBtn').addEventListener('click', () => exportXlsx([
    {name: t('sheet_awards'), title: d.company.name, rows: d.awards.map(a => ({
      [t('col_title')]: a.title, [t('col_entity')]: a.entity, [t('col_award')]: a.award_value,
      [t('col_award_type')]: a.award_type, [t('col_status')]: t(a.status), [t('first_seen')]: plainDt(a.first_seen_at)}))},
    {name: t('sheet_bids'), title: d.company.name, rows: d.bids.map(b => ({
      [t('col_title')]: b.title, [t('col_entity')]: b.entity, [t('col_opening')]: plainDt(b.bid_opening_date),
      [t('col_offer')]: b.offer_value, [t('col_tech')]: techText(b.technical_result), [t('col_bids')]: b.bid_count,
      [t('col_result')]: isNum(b.won_value) ? `${t('won')} · ${b.won_value}` : ''}))}
  ], 'company-' + d.company.id));
}

applyLang();
api('/api/me').then(m => { $('#who').textContent = m.user; }).catch(() => {});
const fontLoads = document.fonts ? Promise.all(['400 14px Inter', '600 14px Inter', '400 14px "IBM Plex Sans Arabic"', '600 14px "IBM Plex Sans Arabic"']
  .map(f => document.fonts.load(f, 'Aa عربي').catch(() => null))) : Promise.resolve();
Promise.race([fontLoads, new Promise(r => setTimeout(r, 1500))]).then(() => route());
</script>
